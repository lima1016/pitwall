[package]
name = "pitwall-core"
description = "Domain logic for pitwall. Knows nothing about HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dunce = "1.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
